# ER-X Ultimate Production Configuration

system:
  num_threads: 8
  max_memory_gb: 20.0
  soft_memory_gb: 12.0
  batch_size: 50000
  random_seed: 42

paths:
  train_s1: "dataset/train/train_source1.tsv"
  train_s2: "dataset/train/train_source2.tsv"
  train_s3: "dataset/train/train_source3.tsv"
  train_ground_truth: "dataset/train/train_ground_truth.tsv"
  test_s1: "dataset/test/test_source1.tsv"
  test_s2: "dataset/test/test_source2.tsv"
  test_s3: "dataset/test/test_source3.tsv"
  duckdb_path: "cache/erx_ultimate/entity_resolution.duckdb"
  cache_dir: "cache/erx_ultimate"
  artifacts_dir: "artifacts/erx_ultimate"
  outputs_dir: "outputs/erx_ultimate"

retrieval:
  top_k_candidates: 30
  channels:
    - exact_alias
    - tfidf_char_ngram
    - rare_token_idf
    - phonetic_metaphone
    - address_numeric
    - learned_typo_ocr
  rrf_k: 60
  min_candidate_score: 0.001

features:
  num_features: 73
  enable_rapidfuzz_c: true
  enable_address_parsing: true
  enable_phone_website_matching: true

model:
  objective: "binary"
  metric: "binary_logloss"
  boosting_type: "gbdt"
  n_estimators: 1500
  learning_rate: 0.03
  num_leaves: 127
  max_depth: 8
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  max_bin: 255
  free_raw_data: true
  n_jobs: 8

decision:
  f_beta: 0.5
  base_threshold: 0.78
  min_margin: 0.05
  enforce_target_exclusivity: true
  allow_singletons: true
