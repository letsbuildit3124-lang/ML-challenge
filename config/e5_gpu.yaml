# Antigravity One-Shot Multilingual E5 GPU Pipeline Configuration
# Model: intfloat/multilingual-e5-small (384 dimensions, MIT License)

model:
  name: "intfloat/multilingual-e5-small"
  embedding_dim: 384
  precision: "fp16"
  max_length: 128
  normalize_embeddings: true

data:
  expected_total_targets: 10320219
  shard_rows: 100000
  smoke_rows: 10000
  benchmark_rows: 100000

kaggle:
  # Dedicated Kaggle Kernel Slug (ONE notebook runs all shards)
  kernel_slug: "rajeshshitap/e5-embedding-worker"
  # Dedicated Kaggle Dataset Slug (ONE dataset holds the complete target input)
  dataset_slug: "rajeshshitap/e5-target-input"
  # Accelerator: NvidiaL4, NvidiaTeslaT4, NvidiaA100
  accelerator: "NvidiaL4"
  # Kernel execution timeout in seconds (e.g. 3600 = 1 hour)
  timeout_seconds: 7200
  # Max time allowed in QUEUED state before warning/timeout
  queue_timeout_seconds: 180
  # Polling interval in seconds
  poll_interval_seconds: 15
  enable_internet: true
  enable_gpu: true

gpu:
  initial_batch_size: 2048
  batch_candidates:
    - 2048
    - 1024
    - 512
    - 256

storage:
  dtype: "float16"

ann:
  index_type: "ivf_pq"  # flat, ivf, ivf_pq
  nlist: 4096
  pq_m: 48
  pq_nbits: 8
  default_top_k: 50

paths:
  db_path: "cache/entity_resolution.duckdb"
  input_export_dir: "cache/e5_gpu/input"
  input_parquet: "cache/e5_gpu/input/targets.parquet"
  download_dir: "cache/e5_gpu/output"
  staging_dir: "cache/e5_gpu/staging"
  logs_dir: "cache/e5_gpu/logs"
  worker_src_dir: "kaggle/e5_worker"
  
  # Separate artifact paths
  smoke_dir: "cache/ann/e5/smoke"
  benchmark_dir: "cache/ann/e5/benchmark"
  production_dir: "cache/ann/e5/production"
  
  # Production targets
  prod_memmap: "cache/ann/e5/production/target_embeddings.f16.memmap"
  prod_ids: "cache/ann/e5/production/target_ids.json"
  prod_index: "cache/ann/e5/production/target.index"
  prod_metadata: "cache/ann/e5/production/metadata.json"
